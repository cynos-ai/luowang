services:
  luowang:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:24.14.1-bookworm-slim@sha256:b506e7321f176aae77317f99d67a24b272c1f09f1d10f1761f2773447d8da26c}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-https://registry.npmmirror.com/-/binary/playwright}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}
    image: luowang:local
    environment:
      NODE_ENV: production
      LUOWANG_HOST: 0.0.0.0
      LUOWANG_PORT: 3000
      LUOWANG_DATA_DIR: /data
      LUOWANG_ADMIN_PASSWORD: ${LUOWANG_ADMIN_PASSWORD:-}
      LUOWANG_MASTER_KEY: ${LUOWANG_MASTER_KEY:-}
      LUOWANG_ALLOWED_ORIGIN: ${LUOWANG_ALLOWED_ORIGIN:-}
    ports:
      - '127.0.0.1:${LUOWANG_PORT:-3000}:3000'
    volumes:
      - luowang-data:/data
    init: true
    shm_size: 1gb
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  luowang-data:
