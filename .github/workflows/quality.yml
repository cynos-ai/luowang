name: Quality

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_IMAGE: docker.m.daocloud.io/library/node:24.14.1-bookworm-slim@sha256:b506e7321f176aae77317f99d67a24b272c1f09f1d10f1761f2773447d8da26c
      NPM_REGISTRY: https://registry.npmmirror.com
      PLAYWRIGHT_DOWNLOAD_HOST: https://registry.npmmirror.com/-/binary/playwright
      DEBIAN_MIRROR: http://mirrors.aliyun.com/debian
      DEBIAN_SECURITY_MIRROR: http://mirrors.aliyun.com/debian-security
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build deterministic Playwright quality image
        run: >-
          docker build --target quality
          --build-arg "NODE_IMAGE=${NODE_IMAGE}"
          --build-arg "NPM_REGISTRY=${NPM_REGISTRY}"
          --build-arg "PLAYWRIGHT_DOWNLOAD_HOST=${PLAYWRIGHT_DOWNLOAD_HOST}"
          --build-arg "DEBIAN_MIRROR=${DEBIAN_MIRROR}"
          --build-arg "DEBIAN_SECURITY_MIRROR=${DEBIAN_SECURITY_MIRROR}"
          --tag luowang:quality .

      - name: Local acceptance and quality matrix (live is not run in CI)
        run: docker run --rm --init --ipc=host luowang:quality npm run test:acceptance:local

      - name: Build production image
        run: >-
          docker build --target runtime
          --build-arg "NODE_IMAGE=${NODE_IMAGE}"
          --build-arg "NPM_REGISTRY=${NPM_REGISTRY}"
          --build-arg "PLAYWRIGHT_DOWNLOAD_HOST=${PLAYWRIGHT_DOWNLOAD_HOST}"
          --build-arg "DEBIAN_MIRROR=${DEBIAN_MIRROR}"
          --build-arg "DEBIAN_SECURITY_MIRROR=${DEBIAN_SECURITY_MIRROR}"
          --tag luowang:ci .

      - name: Verify production browser runtime
        run: >-
          docker run --rm --init --ipc=host --entrypoint node luowang:ci
          --input-type=module -e
          "import { chromium } from 'playwright'; const browser = await chromium.launch({ headless: true }); console.log('production Chromium ' + browser.version() + ' passed'); await browser.close();"
