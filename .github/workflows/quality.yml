name: Quality

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_IMAGE: docker.m.daocloud.io/library/node:24.14.1-bookworm-slim@sha256:b506e7321f176aae77317f99d67a24b272c1f09f1d10f1761f2773447d8da26c
      NPM_REGISTRY: https://registry.npmmirror.com
      PLAYWRIGHT_DOWNLOAD_HOST: https://registry.npmmirror.com/-/binary/playwright
      DEBIAN_MIRROR: http://mirrors.aliyun.com/debian
      DEBIAN_SECURITY_MIRROR: http://mirrors.aliyun.com/debian-security
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deterministic Playwright quality image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: quality
          load: true
          tags: luowang:quality
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            PLAYWRIGHT_DOWNLOAD_HOST=${{ env.PLAYWRIGHT_DOWNLOAD_HOST }}
            DEBIAN_MIRROR=${{ env.DEBIAN_MIRROR }}
            DEBIAN_SECURITY_MIRROR=${{ env.DEBIAN_SECURITY_MIRROR }}
          cache-from: type=gha,scope=luowang-quality
          cache-to: type=gha,mode=max,scope=luowang-quality,ignore-error=true

      - name: Local acceptance and quality matrix (live is not run in CI)
        run: docker run --rm --init --ipc=host luowang:quality npm run test:acceptance:local

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: luowang:ci
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            PLAYWRIGHT_DOWNLOAD_HOST=${{ env.PLAYWRIGHT_DOWNLOAD_HOST }}
            DEBIAN_MIRROR=${{ env.DEBIAN_MIRROR }}
            DEBIAN_SECURITY_MIRROR=${{ env.DEBIAN_SECURITY_MIRROR }}
          cache-from: |
            type=gha,scope=luowang-quality
            type=gha,scope=luowang-runtime
          cache-to: type=gha,mode=max,scope=luowang-runtime,ignore-error=true

      - name: Verify production browser runtime
        run: >-
          docker run --rm --init --ipc=host --entrypoint node luowang:ci
          --input-type=module -e
          "import { chromium } from 'playwright'; const browser = await chromium.launch({ headless: true }); console.log('production Chromium ' + browser.version() + ' passed'); await browser.close();"
