name: Quality

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_IMAGE: docker.m.daocloud.io/library/node:24.14.1-bookworm-slim@sha256:b506e7321f176aae77317f99d67a24b272c1f09f1d10f1761f2773447d8da26c
      NPM_REGISTRY: https://registry.npmmirror.com
      PLAYWRIGHT_DOWNLOAD_HOST: https://registry.npmmirror.com/-/binary/playwright
      # GitHub-hosted runners use Debian's CDN; Dockerfile defaults remain overridable.
      DEBIAN_MIRROR: http://deb.debian.org/debian
      DEBIAN_SECURITY_MIRROR: http://deb.debian.org/debian-security
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deterministic Playwright quality image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: quality
          load: true
          tags: luowang:quality
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            PLAYWRIGHT_DOWNLOAD_HOST=${{ env.PLAYWRIGHT_DOWNLOAD_HOST }}
            DEBIAN_MIRROR=${{ env.DEBIAN_MIRROR }}
            DEBIAN_SECURITY_MIRROR=${{ env.DEBIAN_SECURITY_MIRROR }}
          cache-from: type=gha,scope=luowang-quality
          cache-to: type=gha,mode=max,scope=luowang-quality,ignore-error=true

      - name: Local acceptance and quality matrix (live is not run in CI)
        id: local_acceptance
        run: |
          result=0
          report_result=0
          docker run --name luowang-quality-check --init --ipc=host luowang:quality npm run test:acceptance:local || result=$?
          docker cp luowang-quality-check:/app/.cynos/acceptance ./acceptance-results || report_result=$?
          docker rm luowang-quality-check
          if [ "$report_result" -ne 0 ]; then
            echo 'Local acceptance report could not be retained'
            exit "$report_result"
          fi
          exit "$result"

      - name: Retain local acceptance reports
        if: always() && steps.local_acceptance.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: local-acceptance-reports
          path: acceptance-results/**/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: luowang:ci
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
            PLAYWRIGHT_DOWNLOAD_HOST=${{ env.PLAYWRIGHT_DOWNLOAD_HOST }}
            DEBIAN_MIRROR=${{ env.DEBIAN_MIRROR }}
            DEBIAN_SECURITY_MIRROR=${{ env.DEBIAN_SECURITY_MIRROR }}
          cache-from: |
            type=gha,scope=luowang-quality
            type=gha,scope=luowang-runtime
          cache-to: type=gha,mode=max,scope=luowang-runtime,ignore-error=true

      - name: Verify production native MCP and writable tmpfs (zero model requests)
        run: |
          bash scripts/run-browser-sandbox.sh --network none --entrypoint node luowang:ci dist/server/browser/preflight-cli.js
          # Original read-only-home failure must not be reported as ready.
          if bash scripts/run-browser-sandbox.sh --network none -e PI_CODING_AGENT_DIR=/home/node/.pi/agent --entrypoint node luowang:ci dist/server/browser/preflight-cli.js > preflight-denied.json; then
            echo 'Missing writable state directory was incorrectly accepted'
            exit 1
          fi
          docker run --rm --network none -v "$PWD/preflight-denied.json:/proof.json:ro" --entrypoint node luowang:ci -e '
            const r = require("/proof.json");
            if (r.status !== "failed" || r.modelRequests !== 0 || r.failure?.stage !== "state-directory") process.exit(1);
            console.log("Read-only state directory correctly rejected with zero model requests");
          '
